<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha T-Shirts | Factory Ingestion System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 font-sans text-slate-100 min-h-screen">

    <div id="auth-gate-wrapper" class="max-w-md mx-auto pt-28 px-4">
        <div class="bg-slate-900 rounded-3xl p-8 border border-slate-800 shadow-2xl">
            <div class="text-center mb-6">
                <span class="text-indigo-400 text-xs tracking-widest font-mono uppercase font-bold">Alpha T-Shirts Factory</span>
                <h1 class="text-2xl font-bold mt-1">Management Authorization</h1>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <input type="text" id="admin-user" placeholder="Username" value="admin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <input type="password" id="admin-pass" placeholder="Password" value="admin1208" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm tracking-wide transition">Access Ingestion Portal</button>
            </form>
            <p id="auth-error" class="text-xs text-rose-400 text-center mt-2 hidden"></p>
        </div>
    </div>

    <main id="protected-admin-dashboard" class="hidden">
        <nav class="bg-slate-900 border-b border-slate-800 h-16 px-6 flex items-center justify-between shadow-md">
            <span class="text-sm font-mono tracking-widest text-indigo-400">ALPHA T-SHIRTS FACTORY OPERATIONS</span>
            <button onclick="logoutAdmin()" class="text-xs text-slate-400 hover:text-rose-400 font-mono">Sign Out</button>
        </nav>

        <div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-950 text-slate-400 font-mono text-[11px] uppercase border-b border-slate-800">
                                <th class="p-4">Order ID</th>
                                <th class="p-4">Total Products</th>
                                <th class="p-4">Build Specifications</th>
                                <th class="p-4">Shipping Address</th>
                                <th class="p-4">Total Amount</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="firebase-orders-tbody" class="text-sm divide-y divide-slate-800/60">
                            <tr>
                                <td class="p-8 text-slate-500 text-center italic font-mono" colspan="6">Loading orders from Firebase...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4LAphbvlDzuccTI9sk1vxKJrR_uyEtQc",
            authDomain: "alpha-t-shirt-printing.firebaseapp.com",
            projectId: "alpha-t-shirt-printing",
            storageBucket: "alpha-t-shirt-printing.firebasestorage.app",
            messagingSenderId: "813180956672",
            appId: "1:813180956672:web:a27793d383fc410439e8e5",
            databaseURL: "https://alpha-t-shirt-printing-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.startRealtimeSync = function() {
            const ordersRef = ref(database, 'orders');
            onValue(ordersRef, (snapshot) => {
                const tbody = document.getElementById('firebase-orders-tbody');
                const data = snapshot.val();

                if(!data || Object.keys(data).length === 0) {
                    tbody.innerHTML = `<tr><td class="p-8 text-slate-500 text-center italic font-mono" colspan="6">No live orders from Firebase.</td></tr>`;
                    return;
                }

                let rows = "";
                Object.keys(data).forEach((key) => {
                    const batch = data[key];
                    let specsHtml = "";
                    
                    if (batch.items && Array.isArray(batch.items)) {
                        batch.items.forEach(item => {
                            specsHtml += `
                                <div class="text-xs text-slate-300 pb-1 mb-1 border-b border-slate-800/40">
                                    <span class="text-indigo-400 font-bold">[${item.color}]</span> × ${item.quantity || 1} Pcs <br>
                                    <span class="text-[10px] text-slate-400 italic">"${item.prompt}"</span>
                                </div>`;
                        });
                    }

                    rows += `
                        <tr class="hover:bg-slate-900/30 align-top">
                            <td class="p-4 font-mono text-xs text-indigo-400 font-bold">${batch.orderId || key.substring(0, 8)}</td>
                            <td class="p-4">
                                <span class="bg-indigo-950 text-indigo-400 border border-indigo-900/60 font-black px-2.5 py-1 rounded text-sm">
                                    ${batch.totalProducts || 1} Units
                                </span>
                            </td>
                            <td class="p-4">${specsHtml}</td>
                            <td class="p-4 text-xs text-slate-300 max-w-xs break-words">${batch.shippingAddress || 'No Address'}</td>
                            <td class="p-4 font-black text-white">${batch.totalPrice || '₹0'}</td>
                            <td class="p-4 text-right">
                                <button onclick="deleteFirebaseOrder('${key}')" class="text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-900 px-2.5 py-1 rounded-lg hover:bg-emerald-900/60">Fulfill ✓</button>
                            </td>
                        </tr>`;
                });
                tbody.innerHTML = rows;
            }, (error) => {
                console.error("Firebase error:", error);
                document.getElementById('firebase-orders-tbody').innerHTML = `<tr><td class="p-4 text-rose-400" colspan="6">Firebase connection error: ${error.message}</td></tr>`;
            });
        };

        window.deleteFirebaseOrder = function(key) {
            if(confirm('Mark this order as fulfilled and remove from queue?')) {
                remove(ref(database, `orders/${key}`))
                    .then(() => alert('✅ Order fulfilled and removed!'))
                    .catch(err => alert('❌ Error: ' + err.message));
            }
        };
    </script>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errMsg = document.getElementById('auth-error');

            if(user === 'admin' && pass === 'admin1208') {
                document.getElementById('auth-gate-wrapper').classList.add('hidden');
                document.getElementById('protected-admin-dashboard').classList.remove('hidden');
                window.startRealtimeSync();
                errMsg.classList.add('hidden');
            } else {
                errMsg.textContent = '❌ Invalid credentials';
                errMsg.classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            document.getElementById('protected-admin-dashboard').classList.add('hidden');
            document.getElementById('auth-gate-wrapper').classList.remove('hidden');
            document.getElementById('admin-user').value = "admin";
            document.getElementById('admin-pass').value = "admin1208";
        }
    </script>
</body>
</html>
