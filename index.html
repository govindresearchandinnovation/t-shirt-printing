<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintCraft.AI | Customer Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-fade { display: none; }
        .slide-fade.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 scroll-smooth">

    <!-- NAVIGATION -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-black text-indigo-600 tracking-wider">PRINT<span class="text-slate-800">CRAFT.AI</span></span>
            <a href="admin.html" target="_blank" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold tracking-wide hover:bg-slate-800 transition">Go to Admin Panel →</a>
        </div>
    </nav>

    <!-- AUTOMATED 2-SECOND SLIDESHOW -->
    <header class="bg-white py-12 border-b border-slate-100">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <span class="text-xs font-bold uppercase tracking-widest text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Trending Mockups</span>
            <div class="mt-6 relative max-w-sm mx-auto bg-slate-100 rounded-2xl p-6 shadow-md border border-slate-200">
                <div class="slide-fade active text-center">
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80" class="mx-auto rounded-xl object-cover h-64 w-full">
                    <h3 class="mt-4 font-bold text-slate-800">Neon Cyberpunk Edition</h3>
                </div>
                <div class="slide-fade text-center">
                    <img src="https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=400&q=80" class="mx-auto rounded-xl object-cover h-64 w-full">
                    <h3 class="mt-4 font-bold text-slate-800">Minimalist Tokyo Wave</h3>
                </div>
            </div>
            <p class="text-slate-500 text-sm mt-6 animate-pulse">Scroll down to customize your apparel ↓</p>
        </div>
    </header>

    <!-- CUSTOMIZER STUDIO -->
    <section class="py-16 max-w-7xl mx-auto px-4">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-extrabold tracking-tight">Customize Your T-Shirt in Minutes</h2>
        </div>

        <div class="grid lg:grid-cols-12 gap-8 items-start">
            <!-- Canvas Preview -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center justify-center min-h-[420px]">
                <div id="tshirt-canvas-container" class="relative w-64 h-72 bg-slate-200 rounded-xl flex items-center justify-center transition-colors duration-300">
                    <svg class="absolute inset-0 w-full h-full text-slate-400 fill-current opacity-20" viewBox="0 0 24 24"><path d="M18 2h-3s-1 1-3 1-3-1-3-1H6L2 6v4h3v12h14V10h3V6l-4-4z"/></svg>
                    <div class="absolute w-32 h-44 border border-dashed border-slate-400 top-16 flex flex-col items-center justify-center overflow-hidden bg-white/60 p-2 rounded">
                        <img id="canvas-image-preview" class="max-w-full max-h-full object-contain hidden">
                        <p id="canvas-placeholder-text" class="text-[10px] text-slate-400 font-medium text-center uppercase">Your Design Area</p>
                    </div>
                </div>
                <div class="mt-4"><span id="shirt-badge-color" class="text-xs font-bold uppercase text-slate-500">Fabric: Off-White</span></div>
            </div>

            <!-- Configuration Form Controls -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Step 1: Select T-Shirt Color</label>
                    <div class="flex gap-2">
                        <button onclick="setShirtColor('#f8fafc', 'Off-White')" class="w-8 h-8 rounded-full bg-slate-100 border-2 border-indigo-600"></button>
                        <button onclick="setShirtColor('#0f172a', 'Midnight Black')" class="w-8 h-8 rounded-full bg-slate-900"></button>
                        <button onclick="setShirtColor('#ef4444', 'Crimson Red')" class="w-8 h-8 rounded-full bg-red-500"></button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Step 2: Upload Reference Graphic</label>
                    <input type="file" id="user-image-upload" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:bg-indigo-50 file:text-indigo-700 file:border-0 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Step 3: AI Prompt Instructions</label>
                    <textarea id="ai-prompt-input" rows="2" class="w-full text-xs border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-500" placeholder="Describe the graphic aesthetic..."></textarea>
                </div>
                <button onclick="addItemToCart()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-slate-800 transition">+ Add This Design to Bundle</button>
            </div>

            <!-- Accumulated Items Basket -->
            <div class="lg:col-span-4 bg-slate-100 p-6 rounded-2xl border border-slate-200 shadow-inner flex flex-col justify-between min-h-[420px]">
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                        <h3 class="text-xs font-bold uppercase text-slate-500">Bundle Cart</h3>
                        <span id="cart-count-badge" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0 Items</span>
                    </div>
                    <div id="cart-items-container" class="space-y-3 max-h-64 overflow-y-auto">
                        <p id="empty-cart-msg" class="text-xs text-slate-400 italic text-center py-8">No custom designs added yet.</p>
                    </div>
                </div>
                <button id="final-submit-btn" disabled onclick="submitFullOrder()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 transition disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed">
                    Submit Order Queue to Admin
                </button>
            </div>
        </div>
    </section>

    <script>
        // Slideshow Loop
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide-fade');
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 2000);

        // Customizer Variables
        let activeColor = "Off-White";
        let graphicName = "Blank Canvas";
        let masterCart = [];

        function setShirtColor(hex, name) {
            activeColor = name;
            document.getElementById('tshirt-canvas-container').style.backgroundColor = hex;
            document.getElementById('shirt-badge-color').textContent = `Fabric: ${name}`;
        }

        document.getElementById('user-image-upload').addEventListener('change', function(e) {
            if(e.target.files[0]) {
                graphicName = e.target.files[0].name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('canvas-image-preview').src = event.target.result;
                    document.getElementById('canvas-image-preview').classList.remove('hidden');
                    document.getElementById('canvas-placeholder-text').classList.add('hidden');
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function addItemToCart() {
            const promptVal = document.getElementById('ai-prompt-input').value.trim() || "No prompt description";
            masterCart.push({ color: activeColor, asset: graphicName, prompt: promptVal });
            updateCartUI();
            
            // Clean workspace
            document.getElementById('ai-prompt-input').value = "";
            document.getElementById('user-image-upload').value = "";
            document.getElementById('canvas-image-preview').classList.add('hidden');
            document.getElementById('canvas-placeholder-text').classList.remove('hidden');
            graphicName = "Blank Canvas";
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const msg = document.getElementById('empty-cart-msg');
            const badge = document.getElementById('cart-count-badge');
            const btn = document.getElementById('final-submit-btn');

            if(masterCart.length === 0) {
                msg.style.display = 'block';
                btn.disabled = true;
                badge.textContent = "0 Items";
                container.innerHTML = "";
                return;
            }

            msg.style.display = 'none';
            btn.disabled = false;
            badge.textContent = `${masterCart.length} Items`;
            container.innerHTML = "";

            masterCart.forEach((item, index) => {
                container.innerHTML += `
                    <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs shadow-sm">
                        <div>
                            <span class="font-bold text-slate-800">${item.color} Shirt</span>
                            <p class="text-[10px] text-slate-400 truncate max-w-[180px]">${item.prompt}</p>
                        </div>
                        <button onclick="removeItem(${index})" class="text-rose-500 hover:text-rose-700 font-bold">✕</button>
                    </div>
                `;
            });
        }

        function removeItem(i) {
            masterCart.splice(i, 1);
            updateCartUI();
        }

        function submitFullOrder() {
            // Package batch and save to client-side localStorage database engine
            const existingOrders = JSON.parse(localStorage.getItem('print_orders') || '[]');
            const uniqueBatchId = `BATCH-${Math.floor(1000 + Math.random() * 9000)}`;
            
            existingOrders.push({ id: uniqueBatchId, items: masterCart, timestamp: new Date().toLocaleString() });
            localStorage.setItem('print_orders', JSON.stringify(existingOrders));
            
            alert(`Order ${uniqueBatchId} successfully submitted to the factory network!`);
            masterCart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
